services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova
      POSTGRES_DB: novawallet
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d novawallet"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/NovaWallet.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=db;Port=5432;Database=novawallet;Username=nova;Password=nova
      Swagger__Enabled: "true"
      Jwt__Key: aefcb591-b13d-4021-9eb7-9cadb1d0a1b3
      Jwt__Issuer: NovaWallet
      Jwt__Audience: NovaWallet.Api
      DevAuth__Enabled: "true"
      Transfers__DailyLimitKobo: "50000000"
    depends_on:
      db:
        condition: service_healthy
